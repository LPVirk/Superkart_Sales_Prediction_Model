services:
  backend:
    build: ./backend
    container_name: backend
    network_mode: host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/')"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    container_name: frontend
    network_mode: host
    environment:
      - BACKEND_URL=http://localhost:7860
    depends_on:
      backend:
        condition: service_healthy
